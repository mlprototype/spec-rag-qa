name: Agent Quality Gate

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]
  workflow_dispatch:
    inputs:
      run_real_agent:
        description: Run the ai-agent-rag subprocess evaluation (uses API secrets)
        required: false
        default: false
        type: boolean
      ai_agent_ref:
        description: ai-agent-rag branch, tag, or commit to evaluate
        required: false
        default: main
        type: string
      run_advanced_monitoring:
        description: Run monitor-only Groundedness, Stability, and Cost evaluation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  offline-agent-quality-gate:
    name: Offline Agent Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out spec-rag-qa
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Agent evaluation unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/agent_eval -q

      - name: Prepare fresh Agent quality artifact directory
        if: always()
        run: |
          rm -rf .artifacts/agent-quality
          mkdir -p .artifacts/agent-quality

      - name: Run offline Fixture quality gate
        if: always()
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_agent_evaluation.py \
            --runner fixture \
            --report-json .artifacts/agent-quality/report.json \
            --report-markdown .artifacts/agent-quality/report.md \
            2>&1 | tee .artifacts/agent-quality/run.log

      - name: Upload Agent quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-quality-reports-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .artifacts/agent-quality/report.json
            .artifacts/agent-quality/report.md
            .artifacts/agent-quality/run.log

  real-agent-evaluation:
    name: Real ai-agent-rag Evaluation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_agent }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out spec-rag-qa
        uses: actions/checkout@v4

      - name: Check out ai-agent-rag
        uses: actions/checkout@v4
        with:
          repository: mlprototype/ai-agent-rag
          ref: ${{ inputs.ai_agent_ref }}
          path: ai-agent-rag

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            ai-agent-rag/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r ai-agent-rag/requirements.txt

      - name: Prepare fresh real Agent artifact directory
        if: always()
        run: |
          rm -rf .artifacts/agent-quality
          mkdir -p .artifacts/agent-quality

      - name: Run real Agent quality gate
        if: always()
        env:
          LANGCHAIN_TRACING_V2: "false"
          LANGSMITH_TRACING: "false"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: src
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_agent_evaluation.py \
            --runner subprocess \
            --subprocess-command "python scripts/run_agent_trace.py" \
            --subprocess-cwd ai-agent-rag \
            --timeout-seconds 60 \
            --report-json .artifacts/agent-quality/real-agent.json \
            --report-markdown .artifacts/agent-quality/real-agent.md \
            2>&1 | tee .artifacts/agent-quality/real-agent.log

      - name: Upload real Agent quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-agent-quality-reports-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .artifacts/agent-quality/real-agent.json
            .artifacts/agent-quality/real-agent.md
            .artifacts/agent-quality/real-agent.log

  advanced-agent-monitoring:
    name: Advanced Agent Monitoring
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_advanced_monitoring }}
    runs-on: ubuntu-latest
    environment: agent-evaluation

    steps:
      - name: Check out spec-rag-qa
        uses: actions/checkout@v4

      - name: Check out ai-agent-rag
        uses: actions/checkout@v4
        with:
          repository: mlprototype/ai-agent-rag
          ref: ${{ inputs.ai_agent_ref }}
          path: ai-agent-rag

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            ai-agent-rag/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r ai-agent-rag/requirements.txt

      - name: Prepare fresh advanced monitoring artifact directory
        if: always()
        run: |
          rm -rf .artifacts/agent-advanced
          mkdir -p .artifacts/agent-advanced

      - name: Run monitor-only advanced evaluation
        if: always()
        env:
          AGENT_EVAL_JUDGE_API_KEY: ${{ secrets.AGENT_EVAL_JUDGE_API_KEY }}
          ADVANCED_JUDGE_ALLOWED_HOST: ${{ vars.AGENT_EVAL_JUDGE_ALLOWED_HOST }}
          ADVANCED_JUDGE_MODEL: ${{ vars.AGENT_EVAL_JUDGE_MODEL }}
          ADVANCED_JUDGE_URL: ${{ vars.AGENT_EVAL_JUDGE_URL }}
          LANGCHAIN_TRACING_V2: "false"
          LANGSMITH_TRACING: "false"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: src
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_agent_advanced_evaluation.py \
            --runner subprocess \
            --subprocess-command "python scripts/run_agent_trace.py" \
            --subprocess-cwd ai-agent-rag \
            --timeout-seconds 60 \
            --judge http \
            --judge-url "$ADVANCED_JUDGE_URL" \
            --judge-model "$ADVANCED_JUDGE_MODEL" \
            --judge-allowed-host "$ADVANCED_JUDGE_ALLOWED_HOST" \
            --report-json .artifacts/agent-advanced/report.json \
            --report-markdown .artifacts/agent-advanced/report.md \
            2>&1 | tee .artifacts/agent-advanced/run.log

      - name: Upload advanced monitoring reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-advanced-monitoring-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .artifacts/agent-advanced/report.json
            .artifacts/agent-advanced/report.md
            .artifacts/agent-advanced/run.log
